name: Odoo e2e

# Odoo Community 12 -> 19 on real Odoo and OpenUpgrade: a 12.0 database with Odoo's own demo data (sales, purchases, invoicing,
# stock, CRM) goes through the seven hops with the same runner image the platform uses (docker/odoo-hop.Dockerfile, commits in
# rules/odoo/hops.json), then the before/after reconciliation must match. Synthetic data only; the password is per run.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backend/mf/odoo/**', 'examples/odoo-legacy-modules/**', 'docker/odoo-hop*', 'docker/odoo-hop/**', 'rules/odoo/**', 'backend/tests/e2e/odoo_chain.py', '.github/workflows/odoo-e2e.yml']

permissions:
  contents: read

jobs:
  chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      MF_ODOO_DB_HOST: 127.0.0.1
      MF_ODOO_DB_USER: odoo
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: PostgreSQL 13 (base aislada de la migración)
        run: |
          PW="$(openssl rand -hex 16)"; echo "::add-mask::$PW"
          echo "MF_ODOO_DB_PASSWORD=$PW" >> "$GITHUB_ENV"
          JWT="$(openssl rand -hex 32)"; echo "::add-mask::$JWT"
          echo "MF_DEV_JWT_SECRET=$JWT" >> "$GITHUB_ENV"
          docker run -d --name odoo-db --network host -e POSTGRES_USER=odoo -e POSTGRES_PASSWORD="$PW" postgres:13
          for i in $(seq 1 30); do docker exec odoo-db pg_isready -U odoo && break; sleep 2; done
      - name: Base Odoo 12 con datos demo
        run: |
          docker run --rm --network host -e HOST=127.0.0.1 -e USER=odoo -e PASSWORD="$MF_ODOO_DB_PASSWORD" odoo:12.0 \
            odoo -d demo12 -i sale_management,purchase,account,stock,crm,contacts --stop-after-init
          docker rmi odoo:12.0
      - name: Preparar (copia, módulos y control)
        run: |
          pip install -q -r backend/requirements.lock
          python backend/tests/e2e/odoo_chain.py prepare
      - name: Siete saltos con OpenUpgrade
        run: |
          mkdir -p /tmp/hop-logs && chmod 777 /tmp/hop-logs
          for row in $(jq -r '.hops[] | "\(.version)=\(.openupgrade)"' rules/odoo/hops.json); do
            v="${row%%=*}"; c="${row##*=}"
            echo "::group::Salto a $v"
            docker build --progress=plain -f docker/odoo-hop.Dockerfile --build-arg ODOO="$v" --build-arg OU_COMMIT="$c" --build-arg OUL_COMMIT="$(jq -r .openupgradelibCommit rules/odoo/hops.json)" -t "mf-odoo-hop:$v" .
            docker run -d --name "hop-$v" --network host -e MF_ODOO_DB_HOST=127.0.0.1 -e MF_ODOO_DB_PASSWORD="$MF_ODOO_DB_PASSWORD" \
              -v /tmp/hop-logs:/hop-logs "mf-odoo-hop:$v"
            python backend/tests/e2e/odoo_chain.py hop "$v" || { docker logs "hop-$v" | tail -50; exit 1; }
            docker rm -f "hop-$v"
            [ "$v" = 19.0 ] || { docker rmi "mf-odoo-hop:$v" > /dev/null && docker image prune -af > /dev/null; }   # 19 stays for the module code step
            df -h / | tail -1
            echo "::endgroup::"
          done
      - name: Conciliación antes / después
        run: python backend/tests/e2e/odoo_chain.py reconcile
      - name: Código de módulos a la medida (port 12 → 19 e instalación en Odoo 19)
        env:
          MF_ODOO_ADDONS_DIR: /tmp/odoo-addons
        run: |
          OMM=$(grep -o 'OMM_COMMIT=[0-9a-f]*' docker/worker.Dockerfile | cut -d= -f2)
          python -m venv /tmp/omm && /tmp/omm/bin/pip install -q "argcomplete==3.7.2" "colorama==0.4.6" "lxml==6.1.3" "PyYAML==6.0.3" \
            "requests==2.34.2" "urllib3==2.8.0" "idna==3.20" "certifi==2026.10.23" "charset-normalizer==3.5.2"
          /tmp/omm/bin/pip install -q --no-deps "https://codeload.github.com/OCA/odoo-module-migrator/tar.gz/$OMM"
          mkdir -p /tmp/odoo-addons && chmod 755 /tmp/odoo-addons
          docker run -d --name hop-code --network host -e MF_ODOO_DB_HOST=127.0.0.1 -e MF_ODOO_DB_PASSWORD="$MF_ODOO_DB_PASSWORD" \
            -v /tmp/hop-logs:/hop-logs -v /tmp/odoo-addons:/tmp/odoo-addons:ro "mf-odoo-hop:19.0"
          MF_TOOL_PATH="/tmp/omm/bin:/usr/local/bin:/usr/bin:/bin" python backend/tests/e2e/odoo_chain.py code examples/odoo-legacy-modules \
            || { docker logs hop-code | tail -30; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: odoo-hop-logs, path: /tmp/hop-logs, retention-days: 7}
