name: Deploy demo pedidos migrado

# La versión migrada de examples/jboss-pedidos-completo, tal como la dejó una ejecución de la plataforma (candidate.zip), como stack
# propio «pedidos-migrado» en el VPS (Portainer), al lado de «jboss-pedidos». No toca la plataforma: solo lee el candidato por la API.
# Valida las dos con scripts/probar.py (26 casos: REST, SOAP, base y rollback, colas, tarea programada y archivos), una a la vez,
# con la base y ActiveMQ reiniciados para cada una, como en un cambio de servidor. Al final quedan las dos arriba.
# REST: http://<VPS>:18084/pedidos/api/salud   SOAP: http://<VPS>:18084/pedidos/ws/pedidos?wsdl
on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: Ejecución (apply) de la plataforma cuyo candidato se despliega
        required: true

permissions:
  contents: read

concurrency: {group: deploy-demo-jboss, cancel-in-progress: false}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: vps cpontabo
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Ejecución válida
        env: {EXECUTION: '${{ inputs.execution_id }}'}
        run: '[[ "$EXECUTION" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]'
      - name: SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
          PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '#!/bin/sh\nprintf "%%s" "$PASSPHRASE"\n' > ~/.ssh/askpass && chmod 700 ~/.ssh/askpass
          printf '%s\n' "$KEY" | SSH_ASKPASS=~/.ssh/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=none ssh-add - >/dev/null
          rm -f ~/.ssh/askpass
      - name: Desplegar y validar
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          EXECUTION: ${{ inputs.execution_id }}
        working-directory: examples/jboss-pedidos-completo
        run: |
          SSH="ssh -o StrictHostKeyChecking=yes $USER@$HOST"
          tar -czf - migrado/docker-compose.yml scripts/probar.py | $SSH "mkdir -p demos/pedidos-migrado && cd demos/pedidos-migrado && tar -xzf - && mv -f migrado/docker-compose.yml . && rmdir migrado && mkdir -p entrada && chmod 777 entrada"
          $SSH "EXECUTION=$EXECUTION bash -s" <<'EOF'
          set -euo pipefail
          {  # bloque completo: bash lo lee entero antes de ejecutar, así ningún docker se come el resto del script por stdin
          cd demos/pedidos-migrado
          API=http://127.0.0.1:3240/api/v1
          TOKEN=$(curl -sf -X POST -H 'Content-Type: application/json' -d '{"username":"admin"}' $API/auth/dev-login | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')
          curl -sf -H "Authorization: Bearer $TOKEN" -o candidate.zip "$API/executions/$EXECUTION/download"
          rm -rf app && mkdir app && python3 -c 'import zipfile,sys; zipfile.ZipFile("candidate.zip").extractall("app")'
          echo "== candidato $EXECUTION"; ls app app/src/main/resources
          docker run --rm -v "$PWD/app:/src" -v pedidos-migrado-m2:/root/.m2 -w /src maven:3.9.9-eclipse-temurin-21 mvn -B -ntp -q package
          ls -l app/target/pedidos.jar
          J="docker compose -f ../jboss-pedidos/docker-compose.yml -f ../jboss-pedidos/docker-compose.vps.yml -p jboss-pedidos --project-directory ../jboss-pedidos"
          M="docker compose -p pedidos-migrado"
          probe() {  # $1 host  $2 evidence  $3 entrada
            docker run --rm --network migration-factory_egress -v "$PWD/probar.py:/probar.py:ro" -v "$3:/entrada" -v "$PWD/evidencia:/ev" \
              python:3.12-alpine sh -c "for i in \$(seq 1 60); do python -c \"import urllib.request; urllib.request.urlopen('http://$1:8080/pedidos/api/salud', timeout=5)\" 2>/dev/null && break; sleep 5; done; python -u /probar.py http://$1:8080/pedidos /ev/$2 --entrada /entrada" </dev/null
          }
          fresh() { $J up -d --force-recreate --renew-anon-volumes db mq; for i in $(seq 1 30); do $J exec -T db pg_isready -U pedidos -d pedidos </dev/null >/dev/null && break; sleep 2; done; }
          rm -rf evidencia && mkdir -p evidencia
          echo "== 1) JBoss original (la versión migrada detenida)"
          $M down 2>/dev/null || true
          $J stop jboss </dev/null; fresh; $J up -d --force-recreate jboss </dev/null
          legacy=0; probe pedidos-jboss legado "$(cd ../jboss-pedidos && pwd)/entrada" || legacy=$?
          echo "== 2) Versión migrada (JBoss detenido)"
          $J stop jboss </dev/null; fresh
          PEDIDOS_BIND=0.0.0.0 $M up -d --force-recreate
          migrado=0; probe pedidos-migrado migrado "$PWD/entrada" || migrado=$?
          echo "== las dos arriba (misma base: para recorrerlas en la demo)"
          $J start jboss
          $M ps; $J ps
          tar -czf evidencia.tgz evidencia
          echo "legado=$legacy migrado=$migrado"
          [ "$legacy" = 0 ] && [ "$migrado" = 0 ]
          }
          EOF
      - name: Evidencia
        if: always()
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p evidencia && ssh -o StrictHostKeyChecking=yes $USER@$HOST "cat demos/pedidos-migrado/evidencia.tgz" | tar -xzf - -C . || true
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json, pathlib
          print('| caso | JBoss | migrado |\n|---|---|---|')
          res = {k: {r['caso']: r for r in json.loads((pathlib.Path('evidencia') / k / 'resumen.json').read_text())} for k in ('legado', 'migrado')
                 if (pathlib.Path('evidencia') / k / 'resumen.json').exists()}
          for caso in dict.fromkeys(c for v in res.values() for c in v):
              print(f"| {caso} | {'OK' if res.get('legado', {}).get(caso, {}).get('ok') else 'FALLA'} | {'OK' if res.get('migrado', {}).get(caso, {}).get('ok') else 'FALLA'} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: evidencia-legado-vs-migrado, path: evidencia, if-no-files-found: ignore}
      - name: Desde fuera del servidor
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: curl -sf --max-time 10 "http://$HOST:18084/pedidos/api/salud" || echo "::warning::El puerto 18084 no responde desde fuera; revisar el firewall del VPS"
      - name: Limpiar
        if: always()
        run: ssh-agent -k >/dev/null 2>&1 || true
