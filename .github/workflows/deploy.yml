name: Deploy VPS (Portainer)

# Manual: Actions → "Deploy VPS (Portainer)" → Run workflow. Runs CI, builds the images, publishes them to GHCR tagged with
# the commit and updates (or creates) the Portainer stack through its API. The VPS never builds and no .env exists anywhere:
# the stack variables come from these secrets (Settings → Environments → "vps"):
#   PORTAINER_URL, PORTAINER_API_KEY, PORTAINER_ENDPOINT_ID, [PORTAINER_INSECURE="true" for the self-signed certificate]
#   POSTGRES_PASSWORD, REDIS_PASSWORD, MF_DEV_JWT_SECRET  (required)   MF_CRED_GITHUB (optional, draft PRs)
# Optional variables (Settings → Environments → "vps" → Variables): MF_ENV, MF_AUTH_MODE, MF_OIDC_*, MF_HOST_SOURCES_DIR.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: {group: deploy-vps, cancel-in-progress: false}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      registry: ${{ steps.reg.outputs.registry }}
    steps:
      - uses: actions/checkout@v5
      - id: reg
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/setup-buildx-action@v3
      - name: Construir y publicar (api, worker, frontend)
        env:
          REG: ${{ steps.reg.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          for img in api worker frontend; do
            docker buildx build --push -f docker/$img.Dockerfile \
              -t "$REG/mf-$img:$SHA" -t "$REG/mf-$img:main" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" .
          done

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    environment: vps            # add required reviewers to this environment to approve each deploy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Compose con las imágenes publicadas (sin build)
        env:
          REG: ${{ needs.images.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          sed -E -e '/^\s+build: \{.*\}\s*$/d' \
                 -e "s#image: migration-factory/(api|worker|frontend):local#image: $REG/mf-\1:$SHA#" docker-compose.yml > stack.yml
          ! grep -nE '^\s+build:|migration-factory/.*:local' stack.yml
          grep -n "image:" stack.yml
      - name: Actualizar el stack en Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          PORTAINER_INSECURE: ${{ secrets.PORTAINER_INSECURE }}
          STACK_ENV: POSTGRES_PASSWORD,REDIS_PASSWORD,MF_DEV_JWT_SECRET,MF_CRED_GITHUB,MF_ENV,MF_AUTH_MODE,MF_OIDC_ISSUER,MF_OIDC_AUDIENCE,MF_OIDC_JWKS_URL,MF_HOST_SOURCES_DIR,MF_UI_PORT,MF_API_PORT
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          MF_DEV_JWT_SECRET: ${{ secrets.MF_DEV_JWT_SECRET }}
          MF_CRED_GITHUB: ${{ secrets.MF_CRED_GITHUB }}
          MF_ENV: ${{ vars.MF_ENV || 'development' }}
          MF_AUTH_MODE: ${{ vars.MF_AUTH_MODE || 'dev' }}
          MF_OIDC_ISSUER: ${{ vars.MF_OIDC_ISSUER }}
          MF_OIDC_AUDIENCE: ${{ vars.MF_OIDC_AUDIENCE }}
          MF_OIDC_JWKS_URL: ${{ vars.MF_OIDC_JWKS_URL }}
          MF_HOST_SOURCES_DIR: ${{ vars.MF_HOST_SOURCES_DIR || '/opt/mf-sources' }}
          MF_UI_PORT: ${{ vars.MF_UI_PORT || '3240' }}
          MF_API_PORT: ${{ vars.MF_API_PORT || '3241' }}
        run: python3 scripts/portainer_deploy.py stack.yml
