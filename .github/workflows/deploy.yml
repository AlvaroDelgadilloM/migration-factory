name: Deploy VPS

# Manual: Actions → "Deploy VPS" → Run workflow. Runs CI, builds the images, publishes them to GHCR tagged with the commit,
# then over SSH copies the compose file and the stack variables to the VPS and runs `docker compose pull && up -d`.
# The VPS never builds. Its .env is written by this job (mode 600, from the secrets below), never kept in Git.
# Secrets of the environment "vps cpontabo":
#   SSH (already configured): VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_SSH_PASSPHRASE, VPS_KNOWN_HOSTS, VPS_PATH (deploy folder)
#   App: POSTGRES_PASSWORD, REDIS_PASSWORD, MF_DEV_JWT_SECRET (required), MF_CRED_GITHUB (optional, draft PRs),
#        MF_S3_ACCESS_KEY/MF_S3_SECRET_KEY + variables MF_ARTIFACT_BACKEND=s3, MF_S3_BUCKET, MF_S3_ENDPOINT_URL, MF_S3_REGION (optional),
#        MF_CRED_VAULT_TOKEN + variable MF_VAULT_ADDR (optional, credentials as vault:mount/path[#field]),
#        MF_CRED_AI (optional, Anthropic API key for DataStage AI proposals; also set the variable MF_AI_ENABLED=true)
# Optional variables: MF_ENV, MF_AUTH_MODE, MF_OIDC_ISSUER, MF_OIDC_AUDIENCE, MF_OIDC_JWKS_URL, MF_HOST_SOURCES_DIR, MF_UI_BIND,
# MF_MAVEN_EXTRA_REPOS (e.g. shibboleth|https://build.shibboleth.net/maven/releases for opensaml, used by CXF WS-Security).
# MF_TEST_ALLOWED_HOSTS (Pruebas: systems the platform may call, host or host:port, e.g. the client's JBoss and the migrated Tomcat).
# VPS_USER must be in the docker group. The stack also shows up in Portainer (as an external stack).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: {group: deploy-vps, cancel-in-progress: false}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      registry: ${{ steps.reg.outputs.registry }}
    steps:
      - uses: actions/checkout@v5
      - id: reg
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/setup-buildx-action@v4
      - name: Construir y publicar (api, worker, frontend)
        env:
          REG: ${{ steps.reg.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          for img in api worker frontend; do
            docker buildx build --push -f docker/$img.Dockerfile \
              -t "$REG/mf-$img:$SHA" -t "$REG/mf-$img:main" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" .
          done

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    environment: vps cpontabo   # add required reviewers to this environment to approve each deploy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Compose con las imágenes publicadas (sin build)
        env:
          REG: ${{ needs.images.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          sed -E -e '/^\s+build: \{.*\}\s*$/d' \
                 -e "s#image: migration-factory/(api|worker|frontend):local#image: $REG/mf-\1:$SHA#" docker-compose.yml > stack.yml
          ! grep -nE '^\s+build:|migration-factory/.*:local' stack.yml
          grep -n "image:" stack.yml
      - name: SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
          PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          # the passphrase reaches ssh-add only through SSH_ASKPASS (env var), the key only through stdin
          printf '#!/bin/sh\nprintf "%%s" "$PASSPHRASE"\n' > ~/.ssh/askpass && chmod 700 ~/.ssh/askpass
          printf '%s\n' "$KEY" | SSH_ASKPASS=~/.ssh/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=none ssh-add - >/dev/null
          rm -f ~/.ssh/askpass
      - name: Variables del stack (.env)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          MF_DEV_JWT_SECRET: ${{ secrets.MF_DEV_JWT_SECRET }}
          MF_CRED_GITHUB: ${{ secrets.MF_CRED_GITHUB }}
          MF_CRED_AI: ${{ secrets.MF_CRED_AI }}
          MF_CRED_VAULT_TOKEN: ${{ secrets.MF_CRED_VAULT_TOKEN }}
          MF_S3_ACCESS_KEY: ${{ secrets.MF_S3_ACCESS_KEY }}
          MF_S3_SECRET_KEY: ${{ secrets.MF_S3_SECRET_KEY }}
          MF_ARTIFACT_BACKEND: ${{ vars.MF_ARTIFACT_BACKEND || 'local' }}
          MF_S3_BUCKET: ${{ vars.MF_S3_BUCKET }}
          MF_S3_ENDPOINT_URL: ${{ vars.MF_S3_ENDPOINT_URL }}
          MF_S3_REGION: ${{ vars.MF_S3_REGION }}
          MF_VAULT_ADDR: ${{ vars.MF_VAULT_ADDR }}
          MF_AI_ENABLED: ${{ vars.MF_AI_ENABLED || 'false' }}
          MF_ENV: ${{ vars.MF_ENV || 'development' }}
          MF_AUTH_MODE: ${{ vars.MF_AUTH_MODE || 'dev' }}
          MF_OIDC_ISSUER: ${{ vars.MF_OIDC_ISSUER }}
          MF_OIDC_AUDIENCE: ${{ vars.MF_OIDC_AUDIENCE }}
          MF_OIDC_JWKS_URL: ${{ vars.MF_OIDC_JWKS_URL }}
          MF_HOST_SOURCES_DIR: ${{ vars.MF_HOST_SOURCES_DIR || './sources' }}
          MF_UI_BIND: ${{ vars.MF_UI_BIND || '127.0.0.1' }}
          MF_MAVEN_EXTRA_REPOS: ${{ vars.MF_MAVEN_EXTRA_REPOS }}   # extra APPROVED Maven repositories "id|https-url,..."
          MF_TEST_ALLOWED_HOSTS: ${{ vars.MF_TEST_ALLOWED_HOSTS }}  # empty = localhost,127.0.0.1 (docker-compose.yml)
        run: |
          for v in POSTGRES_PASSWORD REDIS_PASSWORD MF_DEV_JWT_SECRET; do
            [ -n "${!v}" ] || { echo "Falta el secret obligatorio $v en el environment"; exit 1; }
          done
          umask 077
          for v in POSTGRES_PASSWORD REDIS_PASSWORD MF_DEV_JWT_SECRET MF_CRED_GITHUB MF_CRED_AI MF_AI_ENABLED MF_CRED_VAULT_TOKEN MF_VAULT_ADDR MF_S3_ACCESS_KEY MF_S3_SECRET_KEY \
                   MF_ARTIFACT_BACKEND MF_S3_BUCKET MF_S3_ENDPOINT_URL MF_S3_REGION MF_ENV MF_AUTH_MODE MF_OIDC_ISSUER \
                   MF_OIDC_AUDIENCE MF_OIDC_JWKS_URL MF_HOST_SOURCES_DIR MF_UI_BIND MF_MAVEN_EXTRA_REPOS MF_TEST_ALLOWED_HOSTS; do
            printf '%s=%s\n' "$v" "${!v}"
          done > stack.env
          printf 'MF_UI_PORT=3240\nMF_API_PORT=3241\n' >> stack.env
      - name: Desplegar por SSH (docker compose)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          DIR: ${{ secrets.VPS_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          DIR="${DIR:-migration-factory}"
          SSH="ssh -o StrictHostKeyChecking=yes $USER@$HOST"
          $SSH true || { echo "::error::No se pudo entrar por SSH. Si dice 'Host key verification failed', VPS_KNOWN_HOSTS no tiene la huella de VPS_HOST tal como está escrito (genérela con: ssh-keyscan -t ed25519,ecdsa,rsa VPS_HOST, y si el puerto no es 22: ssh-keyscan -p PUERTO ...)"; exit 1; }
          $SSH "mkdir -p '$DIR/sources' && test -w '$DIR'" || { echo "::error::VPS_USER no puede crear o escribir en la carpeta VPS_PATH"; exit 1; }
          $SSH "docker version --format '{{.Server.Version}}'" >/dev/null || { echo "::error::VPS_USER no puede usar Docker (agréguelo al grupo docker)"; exit 1; }
          $SSH "cat > '$DIR/docker-compose.yml'" < stack.yml
          $SSH "umask 077 && cat > '$DIR/.env' && chmod 600 '$DIR/.env'" < stack.env
          # images are pulled with this job's short-lived token, which is removed right after (packages may stay private)
          printf '%s' "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u '$ACTOR' --password-stdin" >/dev/null
          $SSH bash -s -- "$DIR" <<'EOF'
          set -euo pipefail
          cd "$1"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker compose -p migration-factory pull --quiet
          docker compose -p migration-factory up -d --remove-orphans
          for i in $(seq 1 40); do
            docker compose -p migration-factory ps api --format '{{.Status}}' | grep -q healthy && break
            sleep 5
          done
          docker compose -p migration-factory ps
          docker compose -p migration-factory ps api --format '{{.Status}}' | grep -q healthy
          docker image prune -f >/dev/null
          EOF
      - name: Limpiar
        if: always()
        run: |
          rm -f stack.env
          ssh-agent -k >/dev/null 2>&1 || true
