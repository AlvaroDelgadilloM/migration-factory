name: Deploy VPS (Portainer)

# Manual: Actions → "Deploy VPS (Portainer)" → Run workflow. Runs CI, builds the images, publishes them to GHCR tagged with
# the commit and updates (or creates) the Portainer stack through its API, reached through an SSH tunnel to the VPS: Portainer
# stays bound to the VPS and is never exposed to the internet. The VPS never builds and no .env exists anywhere.
# Secrets of the environment "vps cpontabo":
#   SSH (already configured): VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_SSH_PASSPHRASE, VPS_KNOWN_HOSTS
#   Portainer: PORTAINER_API_KEY, PORTAINER_ENDPOINT_ID          [variable PORTAINER_PORT, default 9443]
#   App: POSTGRES_PASSWORD, REDIS_PASSWORD, MF_DEV_JWT_SECRET (required), MF_CRED_GITHUB (optional, draft PRs)
# Optional variables: MF_ENV, MF_AUTH_MODE, MF_OIDC_*, MF_HOST_SOURCES_DIR (default /opt/mf-sources).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: {group: deploy-vps, cancel-in-progress: false}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      registry: ${{ steps.reg.outputs.registry }}
    steps:
      - uses: actions/checkout@v5
      - id: reg
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/setup-buildx-action@v3
      - name: Construir y publicar (api, worker, frontend)
        env:
          REG: ${{ steps.reg.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          for img in api worker frontend; do
            docker buildx build --push -f docker/$img.Dockerfile \
              -t "$REG/mf-$img:$SHA" -t "$REG/mf-$img:main" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" .
          done

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    environment: vps cpontabo   # add required reviewers to this environment to approve each deploy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Compose con las imágenes publicadas (sin build)
        env:
          REG: ${{ needs.images.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          sed -E -e '/^\s+build: \{.*\}\s*$/d' \
                 -e "s#image: migration-factory/(api|worker|frontend):local#image: $REG/mf-\1:$SHA#" docker-compose.yml > stack.yml
          ! grep -nE '^\s+build:|migration-factory/.*:local' stack.yml
          grep -n "image:" stack.yml
      - name: Túnel SSH hasta Portainer (127.0.0.1 de la VPS)
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
          PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ vars.PORTAINER_PORT || '9443' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          # the passphrase reaches ssh-add only through SSH_ASKPASS (env var), the key only through stdin
          printf '#!/bin/sh\nprintf "%%s" "$PASSPHRASE"\n' > ~/.ssh/askpass && chmod 700 ~/.ssh/askpass
          printf '%s\n' "$KEY" | SSH_ASKPASS=~/.ssh/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=none ssh-add - >/dev/null
          rm -f ~/.ssh/askpass
          ssh -f -N -o StrictHostKeyChecking=yes -o ExitOnForwardFailure=yes -L "19443:127.0.0.1:$PORT" "$USER@$HOST"
      - name: Actualizar el stack en Portainer
        env:
          PORTAINER_URL: https://127.0.0.1:19443
          PORTAINER_INSECURE: 'true'      # Portainer's self-signed certificate, reached only through the authenticated SSH tunnel
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          STACK_ENV: POSTGRES_PASSWORD,REDIS_PASSWORD,MF_DEV_JWT_SECRET,MF_CRED_GITHUB,MF_ENV,MF_AUTH_MODE,MF_OIDC_ISSUER,MF_OIDC_AUDIENCE,MF_OIDC_JWKS_URL,MF_HOST_SOURCES_DIR,MF_UI_PORT,MF_API_PORT
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          MF_DEV_JWT_SECRET: ${{ secrets.MF_DEV_JWT_SECRET }}
          MF_CRED_GITHUB: ${{ secrets.MF_CRED_GITHUB }}
          MF_ENV: ${{ vars.MF_ENV || 'development' }}
          MF_AUTH_MODE: ${{ vars.MF_AUTH_MODE || 'dev' }}
          MF_OIDC_ISSUER: ${{ vars.MF_OIDC_ISSUER }}
          MF_OIDC_AUDIENCE: ${{ vars.MF_OIDC_AUDIENCE }}
          MF_OIDC_JWKS_URL: ${{ vars.MF_OIDC_JWKS_URL }}
          MF_HOST_SOURCES_DIR: ${{ vars.MF_HOST_SOURCES_DIR || '/opt/mf-sources' }}
          MF_UI_PORT: ${{ vars.MF_UI_PORT || '3240' }}
          MF_API_PORT: ${{ vars.MF_API_PORT || '3241' }}
        run: python3 scripts/portainer_deploy.py stack.yml
      - name: Cerrar túnel y ssh-agent
        if: always()
        run: |
          pkill -f 'ssh -f -N .*19443' || true
          ssh-agent -k >/dev/null 2>&1 || true
