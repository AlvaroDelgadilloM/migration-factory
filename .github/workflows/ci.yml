name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: pip install -r backend/requirements-dev.txt
      - name: Backend (API, worker, seguridad, migraciones)
        working-directory: backend
        run: pytest -q -p no:warnings
      - name: Scanner (stdlib)
        run: python -m unittest discover -s tests

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.12', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Construir imágenes (sin publicar)
        run: |
          docker build -f docker/api.Dockerfile -t migration-factory/api:ci .
          docker build -f docker/worker.Dockerfile -t migration-factory/worker:ci .
          docker build -f docker/frontend.Dockerfile -t migration-factory/frontend:ci .
