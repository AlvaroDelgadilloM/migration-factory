# Host nginx on the VPS (HTTP, port 80) in front of Migration Factory, which stays bound to 127.0.0.1:3240.
#
# Install (Ubuntu):
#   sudo apt install -y nginx apache2-utils
#   sudo htpasswd -c /etc/nginx/.mf-htpasswd <usuario>
#   echo "set \$mf_gate \"$(openssl rand -hex 32)\";" | sudo tee /etc/nginx/mf-gate.conf >/dev/null && sudo chmod 640 /etc/nginx/mf-gate.conf
#   sudo cp docker/vps-nginx-http.conf /etc/nginx/sites-available/migration-factory
#   sudo ln -sf /etc/nginx/sites-available/migration-factory /etc/nginx/sites-enabled/ && sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Why a gate cookie: the app sends its own `Authorization: Bearer` header to /api, so HTTP basic auth (same header) cannot
# protect /api. The page asks for the basic-auth password and sets an HttpOnly cookie; /api only answers with that cookie.
# Plain HTTP: everything travels unencrypted. While MF_AUTH_MODE=dev (demo users without password) this gate is mandatory.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  server_tokens off;
  include /etc/nginx/mf-gate.conf;      # set $mf_gate "<random>";
  # allow 203.0.113.10;                 # optional: only your IPs
  # deny all;

  client_max_body_size 210m;            # ZIP uploads (MF_MAX_UPLOAD_MB=200)
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    if ($cookie_mf_gate != $mf_gate) { return 401; }
    proxy_pass http://127.0.0.1:3240;   # the UI container proxies /api to the API
    proxy_buffering off;                # Server-Sent Events (job progress)
    proxy_read_timeout 1h;
  }

  location / {
    auth_basic "Migration Factory";
    auth_basic_user_file /etc/nginx/.mf-htpasswd;
    add_header Set-Cookie "mf_gate=$mf_gate; Path=/; HttpOnly; SameSite=Strict" always;
    proxy_pass http://127.0.0.1:3240;
  }
}
