# Local environment. Secrets come from .env (see .env.example); nothing secret is committed.
name: migration-factory

x-backend-env: &backend-env
  # artifacts and uploads: local volume (default) or any S3-compatible store (then no shared volume is needed)
  MF_ARTIFACT_BACKEND: ${MF_ARTIFACT_BACKEND:-local}
  MF_S3_BUCKET: ${MF_S3_BUCKET:-}
  MF_S3_PREFIX: ${MF_S3_PREFIX:-migration-factory}
  MF_S3_ENDPOINT_URL: ${MF_S3_ENDPOINT_URL:-}
  MF_S3_REGION: ${MF_S3_REGION:-}
  MF_S3_ACCESS_KEY: ${MF_S3_ACCESS_KEY:-}
  MF_S3_SECRET_KEY: ${MF_S3_SECRET_KEY:-}
  MF_AI_ENABLED: ${MF_AI_ENABLED:-false}   # DataStage AI proposals (doc 58); the key MF_CRED_AI only reaches the workers
  MF_ENV: ${MF_ENV:-development}
  MF_DATABASE_URL: postgresql+psycopg://mf:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/mf
  MF_REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/0
  MF_AUTH_MODE: ${MF_AUTH_MODE:-dev}
  MF_DEV_JWT_SECRET: ${MF_DEV_JWT_SECRET:-}
  MF_OIDC_ISSUER: ${MF_OIDC_ISSUER:-}
  MF_OIDC_AUDIENCE: ${MF_OIDC_AUDIENCE:-}
  MF_OIDC_JWKS_URL: ${MF_OIDC_JWKS_URL:-}
  MF_OIDC_CLIENT_ID: ${MF_OIDC_CLIENT_ID:-migration-factory-ui}
  MF_ARTIFACT_DIR: /artifacts
  # Local folders: a host directory is mounted read-only at /sources (MF_HOST_SOURCES_DIR, default ./examples).
  MF_LOCAL_SOURCE_ROOTS: /sources
  MF_MAX_UPLOAD_MB: ${MF_MAX_UPLOAD_MB:-200}
  MF_GIT_ALLOWED_HOSTS: ${MF_GIT_ALLOWED_HOSTS:-github.com,gitlab.com,bitbucket.org}
  MF_TEST_ALLOWED_HOSTS: ${MF_TEST_ALLOWED_HOSTS:-localhost,127.0.0.1}
  MF_CORS_ORIGINS: http://localhost:${MF_UI_PORT:-3240},http://127.0.0.1:${MF_UI_PORT:-3240}

x-odoo-hop: &odoo-hop   # the seven runners of the Odoo 12 -> 19 chain (services odoo-hop-13 ... odoo-hop-19)
  profiles: [odoo]
  platform: linux/amd64          # the official Odoo images of these versions are amd64
  environment:
    MF_ODOO_DB_HOST: odoo-db
    MF_ODOO_DB_PASSWORD: ${MF_ODOO_DB_PASSWORD:-}
  volumes: [odoo-addons:/odoo-addons:ro]
  tmpfs: ["/var/lib/odoo:uid=101,gid=101", "/hop-logs:uid=101,gid=101"]
  networks: [odoo]
  depends_on:
    odoo-db: {condition: service_healthy}
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  deploy:
    resources:
      limits: {cpus: "2.0", memory: 3g, pids: 512}

services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: mf
      POSTGRES_USER: mf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mf -d mf"]
      interval: 3s
      retries: 30

  redis:
    image: redis:8.2.2-alpine3.22
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}

  api:
    build: {context: ., dockerfile: docker/api.Dockerfile}
    image: migration-factory/api:local
    environment: *backend-env
    volumes: [artifacts:/artifacts, "${MF_HOST_SOURCES_DIR:-./examples}:/sources:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:${MF_API_PORT:-3241}:8000"]   # local only: pilot script and API docs
    networks: [data, edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      retries: 30

  worker: &worker
    build: {context: ., dockerfile: docker/worker.Dockerfile}
    image: migration-factory/worker:local
    environment: &worker-env
      <<: *backend-env
      MF_WORKER_QUEUES: mf-jobs          # scans, previews, executions, PRs
      MF_MAVEN_FILE_LOCKS: "true"        # two workers share /m2
      MF_WORKSPACE_TIMEOUT_SECONDS: ${MF_WORKSPACE_TIMEOUT_SECONDS:-14400}
      MF_WORK_DIR: /work
      MF_MAVEN_REPO_LOCAL: /m2
      MF_MAVEN_MIRROR_URL: ${MF_MAVEN_MIRROR_URL:-https://repo1.maven.org/maven2}
      MF_MAVEN_EXTRA_REPOS: ${MF_MAVEN_EXTRA_REPOS:-}   # extra APPROVED repos "id|https-url,..."
      MF_MAVEN_NETWORK: ${MF_MAVEN_NETWORK:-allowlist}   # offline | central | allowlist
      MF_JOB_TIMEOUT_SECONDS: ${MF_JOB_TIMEOUT_SECONDS:-1800}
      MF_STEP_TIMEOUT_SECONDS: ${MF_STEP_TIMEOUT_SECONDS:-900}
      MF_MAVEN_OPTS: -Xmx1g
      # Git credentials are referenced as env:MF_CRED_<NAME> (project setting "Referencia de credencial"); values only in .env
      MF_CRED_GITHUB: ${MF_CRED_GITHUB:-}
      # DataStage: AI proposals for expressions without deterministic translation (doc 58). Off by default; the key only in .env
      MF_AI_MODEL: ${MF_AI_MODEL:-claude-sonnet-5-5}
      MF_CRED_AI: ${MF_CRED_AI:-}
      # Pruebas > Automáticas: password of the TEST database a migrated app is started against (variables as env:MF_CRED_TEST_DB)
      MF_CRED_TEST_DB: ${MF_CRED_TEST_DB:-}
      # Odoo 12 -> 19 (profile «odoo»): the isolated database server of the migrations; its password only in .env
      MF_ODOO_DB_HOST: odoo-db
      MF_ODOO_DB_PASSWORD: ${MF_ODOO_DB_PASSWORD:-}
      # credentials as vault:mount/path[#field] (HashiCorp Vault KV v2); the token is a credential, removed from the worker env
      MF_VAULT_ADDR: ${MF_VAULT_ADDR:-}
      MF_CRED_VAULT_TOKEN: ${MF_CRED_VAULT_TOKEN:-}
      # heavy re-creatable files (candidates, patches, old snapshots) older than N days are deleted; 0 = keep forever
      MF_ARTIFACT_RETENTION_DAYS: ${MF_ARTIFACT_RETENTION_DAYS:-30}
    volumes: [artifacts:/artifacts, "${MF_HOST_SOURCES_DIR:-./examples}:/sources:ro", work:/work, m2:/m2, odoo-addons:/odoo-addons]
    depends_on:
      api: {condition: service_healthy}
    networks: [data, egress, odoo]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 3g, pids: 1024}   # pids here, not pids_limit: newer Compose rejects both
    # No Docker socket is mounted: builds run as subprocesses of this unprivileged container.

  # Long jobs (workspace migrations by waves, modernizations) on their own worker: they never delay an analysis.
  worker-long:
    <<: *worker
    environment:
      <<: *worker-env
      MF_WORKER_QUEUES: mf-long
      # projects of the same migration wave migrate N at a time (one Maven JVM each, -Xmx1g): memory limit sized for 2
      MF_WORKSPACE_MIGRATION_PARALLELISM: ${MF_WORKSPACE_MIGRATION_PARALLELISM:-2}
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 4g, pids: 1024}

  # Odoo Community 12 -> 19 (optional: COMPOSE_PROFILES=odoo). odoo-db holds the restored dumps and the migration copies; one
  # runner per target version (official Odoo image + OpenUpgrade at the commit of rules/odoo/hops.json). The «odoo» network is
  # internal: the runners reach only odoo-db, never internet or the platform database.
  odoo-db:
    image: postgres:13.23
    profiles: [odoo]
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${MF_ODOO_DB_PASSWORD:-}
    volumes: [odoo-db:/var/lib/postgresql/data]
    networks: [odoo]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      retries: 30


  odoo-hop-13:
    <<: *odoo-hop
    build: {context: ., dockerfile: docker/odoo-hop.Dockerfile, args: {ODOO: "13.0", OU_COMMIT: "55fc878925e090a9f715893a5a5e3dd4ce057bf3"}}
    image: migration-factory/odoo-hop:13.0-55fc8789-5dfe3b48

  odoo-hop-14:
    <<: *odoo-hop
    build: {context: ., dockerfile: docker/odoo-hop.Dockerfile, args: {ODOO: "14.0", OU_COMMIT: "9c93464291e74eb1e24723ef84bee62cbd88e5f6"}}
    image: migration-factory/odoo-hop:14.0-9c934642-5dfe3b48

  odoo-hop-15:
    <<: *odoo-hop
    build: {context: ., dockerfile: docker/odoo-hop.Dockerfile, args: {ODOO: "15.0", OU_COMMIT: "913e7d32c7dafb1ec7131e74929053af7f7a23a6"}}
    image: migration-factory/odoo-hop:15.0-913e7d32-5dfe3b48

  odoo-hop-16:
    <<: *odoo-hop
    build: {context: ., dockerfile: docker/odoo-hop.Dockerfile, args: {ODOO: "16.0", OU_COMMIT: "afa31b1df1a4dd1f5f5c8cc47d938685fa255d1d"}}
    image: migration-factory/odoo-hop:16.0-afa31b1d-5dfe3b48

  odoo-hop-17:
    <<: *odoo-hop
    build: {context: ., dockerfile: docker/odoo-hop.Dockerfile, args: {ODOO: "17.0", OU_COMMIT: "61daab09ab6c0d21234b96374d9291d3e02ee9e4"}}
    image: migration-factory/odoo-hop:17.0-61daab09-5dfe3b48

  odoo-hop-18:
    <<: *odoo-hop
    build: {context: ., dockerfile: docker/odoo-hop.Dockerfile, args: {ODOO: "18.0", OU_COMMIT: "a393ddbe56b6913eea1e77b42be93152ac00b16d"}}
    image: migration-factory/odoo-hop:18.0-a393ddbe-5dfe3b48

  odoo-hop-19:
    <<: *odoo-hop
    build: {context: ., dockerfile: docker/odoo-hop.Dockerfile, args: {ODOO: "19.0", OU_COMMIT: "bf12c3cee6097145e53efa589b0d99a7e64d6a87"}}
    image: migration-factory/odoo-hop:19.0-bf12c3ce-5dfe3b48

  frontend:
    build: {context: ., dockerfile: docker/frontend.Dockerfile}
    image: migration-factory/frontend:local
    ports: ["${MF_UI_BIND:-127.0.0.1}:${MF_UI_PORT:-3240}:8080"]   # MF_UI_BIND=172.17.0.1: reachable by a proxy container (NPM), not from internet
    depends_on:
      api: {condition: service_healthy}
    environment:
      MF_CSP_CONNECT_EXTRA: ${MF_CSP_CONNECT_EXTRA:-}   # e.g. the OIDC issuer origin in oidc mode
    networks: [edge]
    read_only: true
    tmpfs: ["/tmp:uid=101,gid=101", "/var/cache/nginx:uid=101,gid=101", "/etc/nginx/conf.d:uid=101,gid=101"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  data: {internal: true}   # postgres/redis unreachable from outside
  edge: {}
  egress: {}               # worker egress (Maven mirror, Git hosts)
  odoo: {internal: true}   # odoo-db and the hop runners: no internet

volumes:
  pgdata: {}
  redisdata: {}
  artifacts: {}
  work: {}
  m2: {}
  odoo-db: {}
  odoo-addons: {}
