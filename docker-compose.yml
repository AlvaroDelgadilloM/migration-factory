# Local environment. Secrets come from .env (see .env.example); nothing secret is committed.
name: migration-factory

x-backend-env: &backend-env
  MF_ENV: development
  MF_DATABASE_URL: postgresql+psycopg://mf:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/mf
  MF_REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/0
  MF_AUTH_MODE: ${MF_AUTH_MODE:-dev}
  MF_DEV_JWT_SECRET: ${MF_DEV_JWT_SECRET:-}
  MF_OIDC_ISSUER: ${MF_OIDC_ISSUER:-}
  MF_OIDC_AUDIENCE: ${MF_OIDC_AUDIENCE:-}
  MF_OIDC_JWKS_URL: ${MF_OIDC_JWKS_URL:-}
  MF_OIDC_CLIENT_ID: ${MF_OIDC_CLIENT_ID:-migration-factory-ui}
  MF_ARTIFACT_DIR: /artifacts
  # Local folders: a host directory is mounted read-only at /sources (MF_HOST_SOURCES_DIR, default ./examples).
  MF_LOCAL_SOURCE_ROOTS: /sources
  MF_MAX_UPLOAD_MB: ${MF_MAX_UPLOAD_MB:-200}
  MF_GIT_ALLOWED_HOSTS: ${MF_GIT_ALLOWED_HOSTS:-github.com,gitlab.com,bitbucket.org}
  MF_CORS_ORIGINS: http://localhost:8080

services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: mf
      POSTGRES_USER: mf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mf -d mf"]
      interval: 3s
      retries: 30

  redis:
    image: redis:8.2.2-alpine3.22
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}

  api:
    build: {context: ., dockerfile: docker/api.Dockerfile}
    image: migration-factory/api:local
    environment: *backend-env
    volumes: [artifacts:/artifacts, "${MF_HOST_SOURCES_DIR:-./examples}:/sources:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]   # local only: pilot script and API docs
    networks: [data, edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      retries: 30

  worker: &worker
    build: {context: ., dockerfile: docker/worker.Dockerfile}
    image: migration-factory/worker:local
    environment: &worker-env
      <<: *backend-env
      MF_WORKER_QUEUES: mf-jobs          # scans, previews, executions, PRs
      MF_MAVEN_FILE_LOCKS: "true"        # two workers share /m2
      MF_WORKSPACE_TIMEOUT_SECONDS: ${MF_WORKSPACE_TIMEOUT_SECONDS:-14400}
      MF_WORK_DIR: /work
      MF_MAVEN_REPO_LOCAL: /m2
      MF_MAVEN_MIRROR_URL: ${MF_MAVEN_MIRROR_URL:-https://repo1.maven.org/maven2}
      MF_MAVEN_EXTRA_REPOS: ${MF_MAVEN_EXTRA_REPOS:-}   # extra APPROVED repos "id|https-url,..."
      MF_MAVEN_NETWORK: ${MF_MAVEN_NETWORK:-allowlist}   # offline | central | allowlist
      MF_JOB_TIMEOUT_SECONDS: ${MF_JOB_TIMEOUT_SECONDS:-1800}
      MF_STEP_TIMEOUT_SECONDS: ${MF_STEP_TIMEOUT_SECONDS:-900}
      MF_MAVEN_OPTS: -Xmx1g
    # Git credentials are referenced as env:MF_CRED_<NAME>; add them here from .env when needed, e.g.
    # MF_CRED_GITHUB: ${MF_CRED_GITHUB:-}
    volumes: [artifacts:/artifacts, "${MF_HOST_SOURCES_DIR:-./examples}:/sources:ro", work:/work, m2:/m2]
    depends_on:
      api: {condition: service_healthy}
    networks: [data, egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 3g}
    # No Docker socket is mounted: builds run as subprocesses of this unprivileged container.

  # Long jobs (workspace migrations by waves, modernizations) on their own worker: they never delay an analysis.
  worker-long:
    <<: *worker
    environment:
      <<: *worker-env
      MF_WORKER_QUEUES: mf-long

  frontend:
    build: {context: ., dockerfile: docker/frontend.Dockerfile}
    image: migration-factory/frontend:local
    ports: ["127.0.0.1:${MF_UI_PORT:-8080}:8080"]
    depends_on:
      api: {condition: service_healthy}
    environment:
      MF_CSP_CONNECT_EXTRA: ${MF_CSP_CONNECT_EXTRA:-}   # e.g. the OIDC issuer origin in oidc mode
    networks: [edge]
    read_only: true
    tmpfs: ["/tmp:uid=101,gid=101", "/var/cache/nginx:uid=101,gid=101", "/etc/nginx/conf.d:uid=101,gid=101"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  data: {internal: true}   # postgres/redis unreachable from outside
  edge: {}
  egress: {}               # worker egress (Maven mirror, Git hosts)

volumes:
  pgdata: {}
  redisdata: {}
  artifacts: {}
  work: {}
  m2: {}
